name: Build contributors page

on:
  push:
    branches: [main]
    paths:
      - "contributors/**"
      - "scripts/**"

permissions:
  contents: write

# A burst of merges would otherwise race: several runs regenerate the same file
# and all but the first fail to push against a moved main.
concurrency:
  group: build-contributors
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/build-contributors.mjs

      # Only CONTRIBUTORS.md is written, and the path filter above does not
      # include it, so this push cannot retrigger the workflow.
      - name: Commit the regenerated page
        run: |
          if [ -n "$(git status --porcelain CONTRIBUTORS.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONTRIBUTORS.md
            git commit -m "chore: regenerate contributors page"
            git push
          else
            echo "No change."
          fi
