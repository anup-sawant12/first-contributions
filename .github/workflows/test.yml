name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the validator tests
        run: node --test

      # The generated page must match what the contributor files say. If this
      # fails, run `node scripts/build-contributors.mjs` and commit the result.
      - name: Check CONTRIBUTORS.md is up to date
        run: |
          node scripts/build-contributors.mjs
          if [ -n "$(git status --porcelain CONTRIBUTORS.md)" ]; then
            echo "CONTRIBUTORS.md is stale. Run: node scripts/build-contributors.mjs"
            git --no-pager diff CONTRIBUTORS.md
            exit 1
          fi
