name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the validator tests
        run: node --test

      # There is deliberately no "is CONTRIBUTORS.md up to date" check here.
      # It was tried and removed. CONTRIBUTORS.md is generated from the
      # contributors/ directory by build-contributors.yml, which regenerates and
      # pushes it on every merge to main. Checking its freshness on a pull
      # request fails by construction: a contributor's pull request adds their
      # own file and nothing else, so the generated page is always "stale"
      # inside the pull request. That would put a red X on every single first
      # contribution -- the exact discouraging first experience this whole
      # repository exists to avoid.
